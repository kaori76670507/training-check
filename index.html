<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="トレーニング">
<title>トレーニングチェック</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--text:#1c1f24;--sub:#7a8290;--accent:#16a34a;--accent2:#dcfce7;--line:#e5e7eb;--warn:#dc2626;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111317;--card:#1b1e24;--text:#f1f3f5;--sub:#9aa3b0;--accent:#22c55e;--accent2:#14351f;--line:#2a2e36}}
:root[data-theme="dark"]{--bg:#111317;--card:#1b1e24;--text:#f1f3f5;--sub:#9aa3b0;--accent:#22c55e;--accent2:#14351f;--line:#2a2e36}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,"Hiragino Sans",sans-serif;min-height:100vh}
main{max-width:480px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:20px;margin:4px 0 16px;text-align:center}
.stats{display:flex;gap:10px;margin-bottom:16px}
.stat{flex:1;background:var(--card);border-radius:16px;padding:12px;text-align:center}
.stat b{display:block;font-size:28px;color:var(--accent)}
.stat span{font-size:12px;color:var(--sub)}
#big{width:100%;border:0;border-radius:24px;padding:30px 10px;font-size:26px;font-weight:700;background:var(--accent);color:#fff;box-shadow:0 6px 18px rgba(22,163,74,.3)}
#big:active{transform:scale(.98)}
#big.done{background:var(--accent2);color:var(--accent);box-shadow:none}
.card{background:var(--card);border-radius:20px;padding:14px;margin-top:16px}
.card h2{font-size:14px;margin:0 0 8px}
.bar{height:12px;border-radius:6px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}
.row{display:flex;justify-content:space-between;align-items:center;margin-top:8px;font-size:13px;color:var(--sub);gap:8px}
.yen{font-size:22px;font-weight:700;color:var(--accent)}
.sm{border:0;border-radius:12px;padding:10px 14px;font-size:14px;font-weight:600;background:var(--accent2);color:var(--accent)}
.sm[disabled]{opacity:.4}
.sm.warn{background:none;color:var(--sub);font-weight:400}
#share{width:100%;margin-top:14px;padding:14px;font-size:16px}
.badges{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;text-align:center}
.bd{font-size:28px;filter:grayscale(1);opacity:.3}
.bd.on{filter:none;opacity:1}
.bd small{display:block;font-size:10px;color:var(--sub)}
#msg{font-size:12px;color:var(--sub);text-align:center;margin-top:8px;white-space:pre-wrap;user-select:text}
.nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.nav button{border:0;background:none;font-size:22px;color:var(--text);padding:6px 14px}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center}
.dow{font-size:11px;color:var(--sub)}
.d{aspect-ratio:1;border-radius:50%;border:0;background:none;color:var(--text);font-size:15px}
.d.on{background:var(--accent);color:#fff;font-weight:700}
.d.today{outline:2px solid var(--accent)}
.d.future{color:var(--sub);opacity:.4}
.runs{margin-top:10px;border-top:1px solid var(--line);padding-top:6px}
.runs .row b{color:var(--text);font-weight:600}
.hint{font-size:12px;color:var(--sub);text-align:center;margin-top:10px}
#pbtn{display:block;margin:22px auto 0}
#panel{display:none;border:2px solid var(--accent)}
#panel.on{display:block}
#panel label{display:flex;align-items:center;gap:8px;font-size:14px;margin-top:10px}
#panel input{width:80px;padding:8px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--text);font-size:16px}
.mb{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;z-index:9}
.mb.on{display:flex}
.mbox{background:var(--card);border-radius:20px;padding:22px;width:86%;max-width:340px;text-align:center}
.mbox h3{margin:0 0 6px;font-size:17px}
.mbox p{margin:0 0 12px;font-size:12px;color:var(--warn);min-height:16px}
#pin{width:100%;font-size:28px;text-align:center;letter-spacing:12px;padding:10px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--text)}
.mrow{display:flex;gap:10px;margin-top:14px}
.mrow button{flex:1}
</style>
</head>
<body>
<main>
<h1>🏃 トレーニングチェック</h1>
<div class="stats">
<div class="stat"><b id="streak">0</b><span>連続日数</span></div>
<div class="stat"><b id="month">0</b><span>今月の日数</span></div>
<div class="stat"><b id="total">0</b><span>合計</span></div>
</div>
<button id="big">今日やった！</button>
<button class="sm" id="share">📨 おうちの人に報告する</button>
<div id="msg"></div>
<div class="card">
<h2 id="rtitle"></h2>
<div class="bar"><i id="bar"></i></div>
<div class="row"><span id="next"></span><span>もらえる金額 <b class="yen" id="yen">0円</b></span></div>
<div class="row"><span id="earned"></span></div>
<div class="runs"><div class="row"><span>📒 連続の内訳（新しい順）</span></div><div id="runs"></div></div>
</div>
<div class="card"><h2>🏅 バッジ（連続日数）</h2><div class="badges" id="badges"></div></div>
<div class="card">
<div class="nav"><button id="prev">‹</button><strong id="title"></strong><button id="next2">›</button></div>
<div class="grid" id="grid"></div>
<div class="hint" id="hint"></div>
</div>
<button class="sm warn" id="pbtn">🔒 親モード</button>
<div class="card" id="panel">
<h2>🔓 親モード</h2>
<div class="row"><span>受取待ち <b class="yen" id="punpaid">0円</b></span><button class="sm" id="pay">渡した（受取済みにする）</button></div>
<label>ごほうびの条件: 連続<input id="cdays" type="number" inputmode="numeric" min="2" max="100">日ごとに<input id="cyen" type="number" inputmode="numeric" min="0" max="100000">円</label>
<div class="row"><button class="sm" id="csave">条件を保存</button><button class="sm" id="cpin">暗証番号を変更</button></div>
<div class="hint">この間は、カレンダーのどの日付でも直せます</div>
<div class="row" style="justify-content:center"><button class="sm" id="plock">🔒 ロックする</button></div>
</div>
</main>
<div class="mb" id="mb"><div class="mbox">
<h3 id="mt"></h3><p id="me"></p>
<input id="pin" type="password" inputmode="numeric" maxlength="4" autocomplete="off">
<div class="mrow"><button class="sm warn" id="mc">やめる</button><button class="sm" id="mo">OK</button></div>
</div></div>
<script>
const KEY="training-check-v1",PKEY="training-paid-v1",CKEY="training-cfg-v1";
let days={},paid=0,cfg={days:10,yen:250,pin:""};
try{days=JSON.parse(localStorage.getItem(KEY)||"{}")||{}}catch(e){}
try{paid=Number(localStorage.getItem(PKEY))||0}catch(e){}
try{cfg=Object.assign(cfg,JSON.parse(localStorage.getItem(CKEY)||"{}"))}catch(e){}
const sv=(k,v)=>{try{localStorage.setItem(k,typeof v==="string"?v:JSON.stringify(v))}catch(e){}};
const SEED=["2026-09-26","2026-09-27","2026-09-28","2026-09-29","2026-09-30","2026-10-01","2026-10-02","2026-10-09"];
try{if(!localStorage.getItem("training-seed-v1")){SEED.forEach(k=>days[k]=1);sv(KEY,days);sv("training-seed-v1","1")}}catch(e){}
try{if(!localStorage.getItem("training-seed-v2")){["2026-10-07"].forEach(k=>days[k]=1);sv(KEY,days);sv("training-seed-v2","1")}}catch(e){}
const $=id=>document.getElementById(id);
const pad=n=>String(n).padStart(2,"0");
const fmt=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const todayKey=()=>fmt(new Date());
let view=new Date();view.setDate(1);
let parent=false,ptimer=null;

async function hash(s){
  try{const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode("tc1:"+s));
    return Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,"0")).join("")}
  catch(e){return "p:"+s}
}
function ask(title,err){
  return new Promise(res=>{
    $("mt").textContent=title;$("me").textContent=err||"";$("pin").value="";
    $("mb").classList.add("on");setTimeout(()=>$("pin").focus(),50);
    const done=v=>{$("mb").classList.remove("on");$("mo").onclick=$("mc").onclick=null;res(v)};
    $("mo").onclick=()=>{const v=$("pin").value;if(/^\d{4}$/.test(v))done(v);else $("me").textContent="4桁の数字を入れてね"};
    $("mc").onclick=()=>done(null);
  });
}
async function setPin(){
  const a=await ask("新しい暗証番号（4桁）");if(!a)return false;
  const b=await ask("もう一度入力");if(!b)return false;
  if(a!==b){await ask("一致しませんでした","もう一度やりなおし（OKで閉じる）");return false}
  cfg.pin=await hash(a);sv(CKEY,cfg);return true;
}
async function enter(){
  if(!cfg.pin){if(!(await setPin()))return}
  else{
    let err="";
    for(let i=0;i<3;i++){
      const v=await ask("暗証番号を入力",err);if(!v)return;
      if((await hash(v))===cfg.pin){err="";break}
      err="ちがいます";if(i===2)return;
    }
  }
  parent=true;clearTimeout(ptimer);ptimer=setTimeout(lock,5*60*1000);render();
}
function lock(){parent=false;clearTimeout(ptimer);render()}

function runs(){
  const ks=Object.keys(days).sort();let r=[],cur=null,prev=null;
  for(const k of ks){
    const d=new Date(k+"T00:00:00");
    if(prev&&Math.round((d-prev)/864e5)===1){cur.len++;cur.end=k}
    else{if(cur)r.push(cur);cur={start:k,end:k,len:1}}
    prev=d;
  }
  if(cur)r.push(cur);return r;
}
function streak(){
  let d=new Date(),n=0;
  if(!days[fmt(d)])d.setDate(d.getDate()-1);
  while(days[fmt(d)]){n++;d.setDate(d.getDate()-1)}
  return n;
}
const BADGES=[[3,"🌱"],[7,"🔥"],[10,"🥉"],[20,"🥈"],[30,"🥇"],[50,"🏆"],[100,"👑"]];
function calc(){
  const r=runs(),st=streak(),D=cfg.days,Y=cfg.yen;
  const earned=r.reduce((a,x)=>a+Math.floor(x.len/D)*Y,0);
  return {r,st,earned,unpaid:Math.max(0,earned-paid),best:r.length?Math.max(...r.map(x=>x.len)):0};
}
function render(){
  const t=todayKey(),y=view.getFullYear(),m=view.getMonth(),D=cfg.days,Y=cfg.yen;
  $("title").textContent=y+"年"+(m+1)+"月";
  $("big").classList.toggle("done",!!days[t]);
  $("big").textContent=days[t]?"✅ 今日はできた！":"今日やった！";
  const g=$("grid");g.innerHTML="";
  "日月火水木金土".split("").forEach(w=>{const e=document.createElement("div");e.className="dow";e.textContent=w;g.appendChild(e)});
  const first=new Date(y,m,1).getDay(),last=new Date(y,m+1,0).getDate();
  for(let i=0;i<first;i++)g.appendChild(document.createElement("div"));
  for(let i=1;i<=last;i++){
    const k=y+"-"+pad(m+1)+"-"+pad(i);
    const b=document.createElement("button");b.className="d";b.textContent=i;
    if(days[k])b.classList.add("on");
    if(k===t)b.classList.add("today");
    if(k>t)b.classList.add("future");
    else if(parent||k===t||!days[k])b.onclick=()=>{days[k]?delete days[k]:days[k]=1;sv(KEY,days);render()};
    g.appendChild(b);
  }
  $("hint").textContent=parent?"親モード：どの日付もタップで付けたり消したりできます":"付け忘れた日もタップで追加できます（付けた日を消すのは親モード）";
  const mk=y+"-"+pad(m+1);
  $("month").textContent=Object.keys(days).filter(k=>k.startsWith(mk)).length;
  $("total").textContent=Object.keys(days).length;
  const c=calc();
  $("streak").textContent=c.st;
  const rem=c.st%D;
  $("rtitle").textContent="💰 ごほうび（"+D+"日連続ごとに"+Y+"円）";
  $("bar").style.width=(c.st>0&&rem===0?100:rem/D*100)+"%";
  $("next").textContent=c.st>0&&rem===0?"🎉 "+D+"日達成！":"あと"+(D-rem)+"日で+"+Y+"円";
  $("yen").textContent=c.unpaid+"円";
  $("earned").textContent="これまでの獲得 "+c.earned+"円 / 受取済み "+Math.min(paid,c.earned)+"円";
  const md=k=>{const a=k.split("-");return (+a[1])+"/"+(+a[2])};
  $("runs").innerHTML=c.r.length?c.r.slice(-6).reverse().map(x=>{const g=Math.floor(x.len/D)*Y;return `<div class="row"><span>${md(x.start)}${x.start===x.end?"":"〜"+md(x.end)}　${x.len}日連続</span><b>${g>0?"+"+g+"円":D+"日に届かず 0円"}</b></div>`}).join(""):'<div class="row"><span>まだ記録がありません</span></div>';
  $("badges").innerHTML=BADGES.map(([n,e])=>`<div class="bd ${c.best>=n?"on":""}">${e}<small>${n}日</small></div>`).join("");
  $("panel").classList.toggle("on",parent);
  $("pbtn").style.display=parent?"none":"block";
  if(parent){$("punpaid").textContent=c.unpaid+"円";$("pay").disabled=c.unpaid===0;$("cdays").value=D;$("cyen").value=Y}
}
$("big").onclick=()=>{const t=todayKey();days[t]?delete days[t]:days[t]=1;sv(KEY,days);render()};
$("prev").onclick=()=>{view.setMonth(view.getMonth()-1);render()};
$("next2").onclick=()=>{view.setMonth(view.getMonth()+1);render()};
$("pbtn").onclick=enter;
$("plock").onclick=lock;
$("pay").onclick=()=>{if(!parent)return;paid=calc().earned;sv(PKEY,String(paid));render()};
$("csave").onclick=()=>{
  if(!parent)return;
  const d=parseInt($("cdays").value,10),y=parseInt($("cyen").value,10);
  if(!(d>=2&&d<=100&&y>=0&&y<=100000)){$("msg").textContent="条件の数字を確認してね";return}
  cfg.days=d;cfg.yen=y;sv(CKEY,cfg);$("msg").textContent="条件を保存しました";render();
};
$("cpin").onclick=async()=>{if(parent){await setPin();render()}};
$("share").onclick=async()=>{
  const c=calc(),tk=todayKey();
  const mcount=Object.keys(days).filter(k=>k.startsWith(tk.slice(0,7))).length;
  const text=(days[tk]?"今日もトレーニングやったよ💪":"トレーニングの記録だよ")+"\n連続"+c.st+"日 / 今月"+mcount+"日 / ごほうび"+c.unpaid+"円";
  const m=$("msg");
  try{await navigator.share({text});m.textContent="";return}catch(e){if(e&&e.name==="AbortError")return}
  try{await navigator.clipboard.writeText(text);m.textContent="コピーしたよ！LINEなどに貼りつけて送ろう\n"+text;return}catch(e){}
  m.textContent="これを送ろう👇\n"+text;
};
render();
</script>
</body>
</html>
